repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: governance
        name: citations and symmetry
        entry: uv run pytest tests/governance -q
        language: system
        pass_filenames: false
        files: ^(src/capex_atlas/(assumptions|metrics|capital_vintages|scenarios|accounting)/|tests/governance/)
