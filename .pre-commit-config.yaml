repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict

  # Markdown and Python docstrings. slopless is the other half of the prose gate,
  # but it needs Node, so it runs in CI rather than forcing every contributor to
  # install a JS toolchain to edit a docstring. Run it locally with `npm run slop`.
  - repo: https://github.com/jman4162/slopscore
    rev: v0.9.1
    hooks:
      - id: slopscore-lint
        args: ["--profile", "technical", "--fail-on", "medium"]
        files: '\.(md|py)$'
        exclude: '\.local\.md$'

  - repo: local
    hooks:
      - id: governance
        name: citations and symmetry
        entry: uv run pytest tests/governance -q
        language: system
        pass_filenames: false
        files: ^(src/capex_atlas/(assumptions|metrics|capital_vintages|scenarios|accounting)/|tests/governance/)
