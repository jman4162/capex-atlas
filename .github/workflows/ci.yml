name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # The dev group carries streamlit and plotly, so the lab is exercised here
        # rather than only imported.
        run: uv sync --group dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy src/

      - name: Layer boundaries
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

      - name: Example bundle audits clean
        # Drift is caught by tests/golden/test_example_bundle.py, which rebuilds
        # into a temp directory and compares *content*. A byte comparison would
        # fail on the provenance block, which is volatile by design.
        run: uv run capex-atlas audit examples/googl-2025fy

      - name: Package builds and its metadata renders
        # A packaging break found at tag time is found after the version number
        # is already spent, so check it on every push.
        run: |
          uv build
          uvx twine check dist/*

      - name: README figures are current
        # These are byte-deterministic by construction, so unlike the bundle they
        # can be compared directly. A committed figure that disagrees with the
        # code is worse than no figure.
        run: |
          uv run python scripts/generate_readme_figures.py
          git diff --exit-code -- docs/_static/ \
            || (echo "docs/_static is stale; run scripts/generate_readme_figures.py" && exit 1)

  prose:
    # Two linters with near-disjoint rule sets: slopscore covers Markdown and
    # Python docstrings, slopless covers structural patterns in Markdown.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --group dev
      - run: npm ci
      - name: slopscore and slopless
        run: ./scripts/slopcheck.sh

  governance:
    # Split out so a failure here reads unambiguously: an uncited constant or an
    # asymmetry between companies, not an ordinary test break.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Citations and symmetry
        run: uv run pytest tests/governance -v
