[project]
name = "capex-atlas"
version = "0.1.0.dev0"
description = "Reproducible, source-linked models of hyperscaler capital deployment, cash flow, and returns"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "John Hodge" }]
keywords = ["sec", "xbrl", "capex", "roic", "financial-analysis", "hyperscaler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "polars>=1.0",
    "duckdb>=1.1",
    "typer>=0.12",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
xbrl = ["arelle-release>=2.30"]
app = ["streamlit>=1.40", "plotly>=5.24"]
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]

[project.scripts]
capex-atlas = "capex_atlas.cli.main:app"

[project.urls]
Homepage = "https://github.com/jman4162/capex-atlas"
Documentation = "https://github.com/jman4162/capex-atlas#readme"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.13",
    "ruff>=0.14",
    "import-linter>=2.1",
    "hypothesis>=6.112",
    "respx>=0.21",
    "slopscore-lint>=0.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capex_atlas"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "N",          # pep8-naming
    "UP",         # pyupgrade
    "B",          # bugbear
    "A",          # builtins shadowing
    "C4",         # comprehensions
    "SIM",        # simplify
    "PTH",        # use pathlib
    "RUF",
]
ignore = [
    "RUF001",  # ambiguous unicode: evidence-status glyphs (● ◆ ▲ ○) are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["capex_atlas"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "network: hits the live SEC API; deselected by default in CI",
]

[tool.coverage.run]
source = ["src/capex_atlas"]
branch = true

# ---------------------------------------------------------------------------
# Prose linting
#
# Two linters, because measured on this repo they overlap on roughly one rule.
# slopscore reads Markdown and Python docstrings; slopless (npm, see package.json)
# reads Markdown only but catches structural patterns slopscore does not.
# ---------------------------------------------------------------------------

[tool.slopscore]
profile = "technical"
strictness = "conservative"

# ---------------------------------------------------------------------------
# Layer boundaries
#
# These contracts are what replaces splitting the project into four separate
# distributions. If a consumer ever needs the deterministic core alone, the
# split becomes mechanical because these boundaries are already enforced.
# ---------------------------------------------------------------------------

[tool.importlinter]
root_package = "capex_atlas"

[[tool.importlinter.contracts]]
name = "Schemas depend on nothing internal"
type = "forbidden"
source_modules = ["capex_atlas.schemas"]
forbidden_modules = [
    "capex_atlas.sources",
    "capex_atlas.xbrl",
    "capex_atlas.normalization",
    "capex_atlas.adapters",
    "capex_atlas.accounting",
    "capex_atlas.metrics",
    "capex_atlas.capital_vintages",
    "capex_atlas.scenarios",
    "capex_atlas.bundle",
    "capex_atlas.viz",
    "capex_atlas.obs",
    "capex_atlas.cli",
]

[[tool.importlinter.contracts]]
name = "Calculation layer stays free of I/O and presentation"
type = "forbidden"
source_modules = [
    "capex_atlas.metrics",
    "capex_atlas.capital_vintages",
    "capex_atlas.scenarios",
]
forbidden_modules = [
    "capex_atlas.sources",
    "capex_atlas.viz",
    "capex_atlas.cli",
    "capex_atlas.bundle",
]

[[tool.importlinter.contracts]]
name = "Provenance and assumptions sit below the calculation layer"
type = "forbidden"
source_modules = ["capex_atlas.provenance", "capex_atlas.assumptions"]
forbidden_modules = [
    "capex_atlas.metrics",
    "capex_atlas.capital_vintages",
    "capex_atlas.adapters",
    "capex_atlas.sources",
    "capex_atlas.cli",
]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "capex_atlas.cli",
    "capex_atlas.bundle",
    "capex_atlas.viz",
    "capex_atlas.scenarios",
    "capex_atlas.capital_vintages",
    "capex_atlas.metrics",
    "capex_atlas.accounting",
    "capex_atlas.adapters",
    # XBRL parsing consumes period normalization, so it sits above it.
    "capex_atlas.xbrl",
    "capex_atlas.normalization",
    "capex_atlas.sources",
    "capex_atlas.provenance",
    "capex_atlas.assumptions",
    "capex_atlas.schemas",
]
exhaustive = false
